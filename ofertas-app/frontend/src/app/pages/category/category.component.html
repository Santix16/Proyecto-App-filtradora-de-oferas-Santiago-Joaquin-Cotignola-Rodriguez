<div class="category-container">
  <header class="category-header">
    <div class="header-actions">
      <button class="back-btn" (click)="goBack()">
        <span class="icon">←</span> Explorar categorías
      </button>
    </div>
    <div class="header-info">
      <div class="emoji-circle">{{ getCategoryEmoji(categoryName) }}</div>
      <h1>{{ categoryName }}</h1>
      <p class="subtitle">Encontramos {{ products.length }} productos con ofertas activas</p>
    </div>
  </header>

  <main class="main-content">
    <div *ngIf="loading" class="loading-grid">
      <div class="skeleton-card" *ngFor="let i of [1,2,3,4]"></div>
    </div>

    <div *ngIf="error" class="error-card">
      <p>{{ error }}</p>
      <button (click)="loadProductsByCategory(categoryName)">Reintentar</button>
    </div>

    <div class="products-grid" *ngIf="!loading && !error">
      <button class="product-card" *ngFor="let product of products" (click)="onProductClick(product)">
        <div class="image-container">
          <img [src]="product.image" [alt]="product.name" loading="lazy">
        </div>

        <div class="card-body">
          <h3 class="product-name">{{ product.name }}</h3>
        </div>

        <div class="card-footer">
          <button class="action-btn">Comparar precios →</button>
        </div>
      </button>
    </div>

    <div class="empty-state" *ngIf="!loading && products.length === 0">
      <div class="empty-icon"></div>
      <h3>Vaya, ahora mismo no hay ofertas aquí</h3>
      <p>Estamos buscando nuevos chollos. ¡Vuelve pronto!</p>
      <button class="primary-btn" (click)="goBack()">Ver otras categorías</button>
    </div>
  </main>
</div>
