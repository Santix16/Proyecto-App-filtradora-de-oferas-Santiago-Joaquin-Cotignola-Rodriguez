<div class="results-container">
  <div class="results-header">
    <h1>Ofertas en {{ subcategory }}</h1>
    <a routerLink="/my-list" class="list-link">Mi lista</a>
    <p *ngIf="offersWithDetails.length > 0">{{ offersWithDetails.length }} ofertas encontradas</p>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    <p>Buscando ofertas...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <!-- Offers Grid -->
  <div *ngIf="!loading && !error" class="offers-grid">
    <app-offer-card
      *ngFor="let offerDetails of offersWithDetails"
      [offerDetails]="offerDetails">
    </app-offer-card>
  </div>

  <!-- No results -->
  <div *ngIf="!loading && !error && offersWithDetails.length === 0" class="no-results">
    <p>No se encontraron ofertas en esta categoría</p>
    <p>Intenta con otra categoría o verifica que hay productos disponibles.</p>
  </div>
</div>
