<div class="results-container">
  <h1>Resultados de Búsqueda</h1>
  
  <div class="products-grid">
    <app-offer-card 
      *ngFor="let product of products" 
      [product]="product">
    </app-offer-card>
  </div>
  
  <div *ngIf="products.length === 0" class="no-results">
    <p>No se encontraron resultados</p>
  </div>
</div>
