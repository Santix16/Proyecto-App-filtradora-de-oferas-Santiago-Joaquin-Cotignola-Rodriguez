<div class="product-detail-container" *ngIf="product">
  <div class="product-image">
    <img [src]="product.image" [alt]="product.name" />
    <div *ngIf="discountPercentage > 0" class="discount-badge">
      -{{ discountPercentage }}%
    </div>
  </div>
  
  <div class="product-info">
    <h1>{{ product.name }}</h1>
    <p class="store-info">{{ product.storeName }}</p>
    <p class="category">Categoría: {{ product.category }}</p>
    
    <div class="price-info">
      <span *ngIf="product.originalPrice" class="original-price">{{ product.originalPrice | currency }}</span>
      <span class="current-price">{{ product.price | currency }}</span>
    </div>
    
    <p class="description">{{ product.description }}</p>
    
    <div class="availability">
      <span *ngIf="product.inStock" class="in-stock">✓ En Stock</span>
      <span *ngIf="!product.inStock" class="out-of-stock">✗ Sin Stock</span>
    </div>
    
    <button [disabled]="!product.inStock" class="add-to-cart-button">
      Agregar al Carrito
    </button>
  </div>
</div>

<div *ngIf="!product" class="no-product">
  <p>Producto no encontrado</p>
</div>
