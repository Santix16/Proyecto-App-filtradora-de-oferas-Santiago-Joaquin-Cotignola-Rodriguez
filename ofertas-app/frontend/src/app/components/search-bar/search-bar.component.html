<div class="search-container">
  <div class="search-wrapper">
    <span class="search-icon-inside">🔍</span>
    <input 
      type="text" 
      [(ngModel)]="ngModelSearchQuery" 
      (input)="onInputChange()"
      (keyup.enter)="onSearch()"
      placeholder="¿Qué producto buscas hoy?"
      class="search-input"
    />
    <button 
      *ngIf="ngModelSearchQuery.length > 0" 
      (click)="clearSearch()" 
      class="clear-inner-button"
      title="Limpiar búsqueda"
    >
      ✕
    </button>
  </div>
  <button (click)="onSearch()" class="search-submit-button">
    Buscar Categoría
  </button>
</div>
